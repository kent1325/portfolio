<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>

<body>
    <main class="page-shell page-shell--narrow">
        <article class="blog-post">
            <p class="page-header__back">
                <a href="/blog/" class="back-link"><span aria-hidden="true">←</span> Back to blog</a>
            </p>
            <header class="blog-post__header">
                <div class="blog-post__meta">
                    <time datetime="{{ post.published_date }}">Published {{ post.published_date }}</time>
                    {% if post.updated_date %}
                    <span aria-hidden="true">·</span>
                    <time datetime="{{ post.updated_date }}">Updated {{ post.updated_date }}</time>
                    {% endif %}
                </div>
                <h1 class="blog-post__title">{{ post.title }}</h1>
                <p class="blog-post__summary">{{ post.summary }}</p>
                {% if post.tags %}
                <ul class="blog-post__tags" aria-label="Tags for {{ post.title }}">
                    {% for tag in post.tags %}
                    <li>{{ tag }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
            </header>
            <div class="blog-post__body">
                {{ body_html | safe }}
            </div>
        </article>
    </main>
</body>
</html>
