<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8fafc" data-theme-color>
    <script>
        (() => {
            const lightThemeColor = "#f8fafc";
            const darkThemeColor = "#020617";
            let storedTheme = null;

            try {
                const theme = localStorage.getItem("portfolio-theme");
                if (theme === "dark" || theme === "light") {
                    storedTheme = theme;
                    document.documentElement.dataset.theme = theme;
                    document.documentElement.style.colorScheme = theme;
                }
            } catch {
                // Ignore storage errors and fall back to the user's system preference.
            }

            const resolvedTheme = storedTheme
                ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            const themeColor = document.querySelector("[data-theme-color]");
            if (themeColor) {
                themeColor.setAttribute(
                    "content",
                    resolvedTheme === "dark" ? darkThemeColor : lightThemeColor
                );
            }
        })();
    </script>
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    <link rel="canonical" href="{{ page_url }}">
    <meta property="og:site_name" content="{{ site_name }}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:type" content="{{ page_type }}">
    <meta property="og:url" content="{{ page_url }}">
    <meta property="og:image" content="{{ page_image_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ page_image_alt }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page_title }}">
    <meta name="twitter:description" content="{{ page_description }}">
    <meta name="twitter:image" content="{{ page_image_url }}">
    <meta name="twitter:image:alt" content="{{ page_image_alt }}">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/scripts/theme-toggle.js" defer></script>
    {% if include_hero_script | default(false) %}
    <script src="/assets/scripts/hero-lines.js" defer></script>
    {% endif %}
</head>
