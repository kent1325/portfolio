<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    <link rel="canonical" href="{{ page_url }}">
    <meta property="og:site_name" content="{{ site_name }}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:type" content="{{ page_type }}">
    <meta property="og:url" content="{{ page_url }}">
    <meta property="og:image" content="{{ page_image_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ page_image_alt }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page_title }}">
    <meta name="twitter:description" content="{{ page_description }}">
    <meta name="twitter:image" content="{{ page_image_url }}">
    <meta name="twitter:image:alt" content="{{ page_image_alt }}">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/styles.css">
    {% if include_hero_script | default(false) %}
    <script src="/assets/scripts/hero-lines.js" defer></script>
    {% endif %}
</head>
