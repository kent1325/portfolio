- title: "2D Brain Age Estimation and Alzheimer’s disease Classification using Deep Learning"
  year: 2023
  summary: "In recent years, deep learning has emerged as a valuable tool for estimating brain age. Neuroimaging is crucial in capturing age-related brain changes and serves as a valuable biomarker for the resurgence of neurological conditions. To detect individuals with Alzheimer’s disease, we propose an extension to the established Global Local Transformer method that first extracts deep features from T1-weighted images. These features are then employed in a simple classification multi-layer perceptron to distinguish subjects as normal aging and cognitively healthy or age-diverging and suffering from Alzheimer’s disease. A model selection process determined the optimal configuration for the Global-Local Transformer of 6 local patches, 5 2D slices per subject, and 6 transformer blocks. Experimental findings reveal that the global-local transformer yields a mean absolute error of 5.34 years when applied to healthy subjects. However, a slight elevation of 0.74 years in the mean absolute error is observed for individuals diagnosed with Alzheimer’s disease, indicating a relatively limited differentiation in brain age between these two subject groups. Despite the observed brain age difference, the classification multi-layer perceptron attains a commendable accuracy of 76.91%, comparable to contemporary state-of-the-art techniques."
  links:
    pdf: "/assets/papers/2d-brain-age-estimation-and-alzheimers-disease-classification-using-deep-learning.pdf"
- title: "Sales Data Modeling and Changepoint Detection"
  year: 2024
  summary: "Businesses often face common challenges related to time-dependent data. In this study, we address the necessity for an effective early warning system capable of detecting changes in consumer behavior, enabling timely responses such as restocking supplies or canceling orders. This research is particularly focused on Maki’s need for such a system. We employ the models: Bayesian Online Changepoint Detection (BOCPD), Pruned Exact Linear Time (PELT), and Prophet. Prophet is utilized to decompose and accurately model the temporal data. Our study involves simulating a real-world scenario for Maki, where the efficacy of BOCPD and PELT in detecting changepoints is evaluated. The results indicate that both BOCPD and PELT can successfully identify changepoints and accurately determine their occurrence. Notably, PELT achieved an F1 score of 0.92 in detecting large abrupt changes, demonstrating its heightened sensitivity to such shifts. In contrast, BOCPD attained an F1 score of 0.75 under the same conditions but exhibited a lower Hamming distance when detecting small continuous changes, indicating its superior performance in identifying more subtle shifts in data."
  links:
    pdf: "/assets/papers/sales-data-modeling-and-changepoint-detection.pdf"
- title: "Condition Monitoring with Machine Learning: A Data-Driven Framework for Quantifying Wind Turbine Energy Loss"
  year: 2025
  summary: "Wind energy significantly contributes to the global shift towards renewable energy, yet operational challenges, such as Leading-Edge Erosion on wind turbine blades, notably reduce energy output. This study introduces an advanced, scalable machine learning framework for condition monitoring of wind turbines, specifically targeting improved detection of anomalies using Supervisory Control and Data Acquisition data. The framework effectively isolates normal turbine behavior through rigorous preprocessing, incorporating domain-specific rules and anomaly detection filters, including Gaussian Mixture Models and a predictive power score. The data cleaning and feature selection process enables identification of deviations indicative of performance degradation, facilitating estimates of annual energy production losses. The data preprocessing methods resulted in significant data reduction, retaining on average 31% of the original SCADA data per wind farm. Notably, 24 out of 35 turbines exhibited clear performance declines. At the same time, seven improved, and four showed no significant changes when employing the power curve feature set, which consisted of wind speed and ambient temperature. Models such as Random Forest, XGBoost, and KNN consistently captured subtle but persistent declines in turbine performance. The developed framework provides a novel approach to existing condition monitoring methodologies by isolating normal operational data and estimating annual energy loss, which can be a key part in reducing maintenance expenditures and mitigating economic impacts from turbine downtime."
  links:
    pdf: "/assets/papers/condition-monitoring-with-machine-learning.pdf"
    external: "https://arxiv.org/abs/2506.13012"
