[project]
name = "portfolio"
version = "0.1.0"
description = "Static portfolio site compiler"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2==3.1.6",
    "markdown==3.10.2",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.14",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "14 days"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

