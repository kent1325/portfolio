name: Rerun Failed Deploy

on:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun-failed-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed deploy jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          MAX_ATTEMPTS: 3
        run: |
          echo "Re-running failed jobs for Deploy run ${RUN_ID}."
          echo "Current attempt: ${RUN_ATTEMPT}; max attempts: ${MAX_ATTEMPTS}."

          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28"
