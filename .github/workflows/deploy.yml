name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "26.0.0"
          cache: "npm"

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Install Node dependencies
        run: npm ci

      - name: Run checks and build site
        run: just check

      - name: Run audits
        run: just audit-run

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
