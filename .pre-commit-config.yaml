minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: portfolio-check
        name: Run portfolio quality gate
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
      - id: portfolio-audit
        name: Run generated-site audit gate
        entry: just audit-run
        language: system
        pass_filenames: false
        always_run: true
